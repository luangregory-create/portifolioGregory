<script setup>
import { ref, computed } from 'vue';

const search = ref('');
const brands = ref([
  { id: 1, name: 'John Deere', tag: 'Tecnologia', desc: 'Sistemas avançados de piloto automático e inteligência de dados.' },
  { id: 2, name: 'New Holland', tag: 'Polivalência', desc: 'Facilidade no manuseio e ótima eficiência operacional.' },
  { id: 3, name: 'Massey Ferguson', tag: 'Tradição', desc: 'Mecânica simples, resistente e altamente confiável.' }
]);

const filteredBrands = computed(() => {
  return brands.value.filter(b => b.name.toLowerCase().includes(search.value.toLowerCase()));
});
</script>

<template>
  <div class="container">
    <h1>🚜 Catálogo de Tratores & Marcas</h1>
    
    <input 
      v-model="search" 
      type="text" 
      placeholder="Buscar marca (ex: John Deere)..." 
      class="search-input"
    />

    <div class="card-grid">
      <div v-for="brand in filteredBrands" :key="brand.id" class="card">
        <span class="tag">{{ brand.tag }}</span>
        <h3>{{ brand.name }}</h3>
        <p>{{ brand.desc }}</p>
      </div>
    </div>
  </div>
</template>

<style scoped>
.container { max-width: 900px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
